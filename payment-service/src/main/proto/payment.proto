syntax = "proto3";

package payment;

option java_package = "com.ecommerce.payment";
option java_multiple_files = true;
option java_outer_classname = "PaymentProto";

// Request Message
message PaymentRequest {
  string order_id = 1;
  double amount = 2;
  string currency = 3;
}

// Response Message
message PaymentResponse {
  string payment_id = 1;
  string order_id = 2;
  string status = 3;
  string message = 4;
}

// Payment Service
service PaymentService {
  // Process payment for an order
  rpc ProcessPayment (PaymentRequest)
      returns (PaymentResponse);
}